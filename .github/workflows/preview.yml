name: Publish concept preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES_PREVIEW: '1'
      - name: Verify preview safeguards
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
          test -f dist/about/index.html
          test -f dist/services/index.html
          test -f dist/contact/index.html
          test -f dist/disclosure/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
