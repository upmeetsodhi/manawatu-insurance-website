name: Build website preview

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm preview cannot be indexed
        run: |
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manawatu-insurance-preview
          path: dist
